name: HTML/CSS/JS Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          test -f index.html
          test -f style.css || test -f css/style.css
          test -f script.js || test -f js/script.js
